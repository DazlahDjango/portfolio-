<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}{{ profile.tagline }}{% endblock %}">
    <title>{% block title %}{{ profile.name }}{% endblock %} — {{ profile.title }}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
    <link rel="alternate icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
</head>
<body>

    {% include 'partials/_nav.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/_footer.html' %}

    <!-- Profile Photo Lightbox Modal -->
    <div id="profileLightbox" class="lightbox-modal" role="dialog" aria-modal="true" aria-label="Profile photo preview">
        <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
        <div class="lightbox-content">
            <div class="lightbox-header">
                <div class="lightbox-title-box">
                    <span class="lightbox-title">{{ profile.name }}</span>
                    <span class="lightbox-subtitle">{{ profile.title }}</span>
                </div>
                <div class="lightbox-actions">
                    <a href="{{ url_for('static', filename='img/profile.png') }}" target="_blank" rel="noopener" class="lightbox-action-btn" title="Open full resolution in new tab">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </a>
                    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close preview">&times;</button>
                </div>
            </div>
            <div class="lightbox-body">
                <img src="{{ url_for('static', filename='img/profile.png') }}" alt="{{ profile.name }} — Profile overview" class="lightbox-img" id="lightboxImg">
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
